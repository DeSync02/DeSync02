name: Update Bat-Computer Stats

on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC = 12:00 AM Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure output directory exists
        run: mkdir -p assets

      - name: Generate stats
        run: python generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: DeSync02

      - name: Commit changes
        run: |
          git config user.name "alfred[bot]"
          git config user.email "actions@github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh Gotham stats"
          git push
